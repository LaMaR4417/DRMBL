<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stats - DRMBL</title>
    <link rel="icon" href="assets/favicon.ico">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <link rel="stylesheet" href="css/skeleton.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/stats.css">
    <script src="js/skeleton.js"></script>
</head>
<body>

    <section class="stats-hero">
        <div class="league-switcher">
            <a href="/stats" class="league-btn active" data-league="drmbl">
                <img src="/PSDs/DRMBL-Logo.png" alt="DRMBL" class="league-logo-img">
            </a>
        </div>
    </section>

    <section class="stats-section">
        <!-- Regular Season / Playoffs toggle — populated by stats.js, hidden until playoff games exist -->
        <div id="stats-mode-toggle" class="stats-mode-toggle hidden"></div>

        <!-- Landing view: 6 leaderboard cards (top 5 each) + team leaderboards below -->
        <div id="stats-landing" class="stats-view"></div>

        <!-- Detail view: one stat sorted full grid -->
        <div id="stats-detail" class="stats-view hidden">
            <div class="stats-detail-header">
                <button type="button" class="stats-back-btn" id="stats-back">← All Leaderboards</button>
                <div class="stats-detail-controls">
                    <select id="stats-detail-stat" class="stats-select" title="Sort by stat"></select>
                    <button type="button" id="stats-detail-qualified" class="stats-toggle-btn active" title="Hide players who have not yet qualified for stat leaders" aria-pressed="true">Show All Players</button>
                    <select id="stats-detail-team" class="stats-select" title="Filter by team"></select>
                    <input type="search" id="stats-detail-search" class="stats-search" placeholder="Search player..." aria-label="Search player by name">
                </div>
            </div>
            <div id="stats-detail-table"></div>
        </div>
    </section>

    <footer>
        &copy; 2026 Del Rio Men's Basketball League
    </footer>

    <script src="js/stats.js"></script>
</body>
</html>
