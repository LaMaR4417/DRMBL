<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <title>DRMBL Live Scoreboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Game selector view -->
    <section id="selector-view" class="view hidden">
        <div class="selector-wrap">
            <h1 class="selector-title">Pick a Game</h1>
            <p class="selector-sub">Choose a live game to display on the scoreboard.</p>
            <div id="selector-status" class="selector-status">Loading live games&hellip;</div>
            <div id="game-list" class="game-list"></div>
        </div>
    </section>

    <!-- Scoreboard view -->
    <section id="scoreboard-view" class="view hidden">
        <a href="?" class="sb-back" title="Back to game selector">&larr; Games</a>

        <div class="sb-clock-row">
            <div class="sb-arrow" id="sb-home-arrow">&#9664;</div>
            <div class="sb-clock" id="sb-clock">10:00</div>
            <div class="sb-arrow" id="sb-away-arrow">&#9654;</div>
        </div>

        <div class="sb-divider-line"></div>

        <div class="sb-team-row">
            <div class="sb-team-cell">
                <div class="sb-team-name" id="sb-home-name">HOME TEAM</div>
            </div>
            <div class="sb-team-cell">
                <div class="sb-team-name" id="sb-away-name">AWAY TEAM</div>
            </div>
        </div>

        <div class="sb-main">
            <aside class="sb-rail sb-rail-home">
                <div class="sb-fouls-block">
                    <div class="sb-stat-label">FOULS</div>
                    <div class="sb-stat-num" id="sb-home-fouls">0</div>
                </div>
                <div class="sb-timeouts-block">
                    <div class="sb-stat-label">TIMEOUTS</div>
                    <div class="sb-to-grid">
                        <div class="sb-to-sub">FULL</div>
                        <div class="sb-to-sub">SHORT</div>
                        <div class="sb-stat-num" id="sb-home-to-full">0</div>
                        <div class="sb-stat-num" id="sb-home-to-short">0</div>
                    </div>
                </div>
            </aside>

            <div class="sb-score-col">
                <div class="sb-score" id="sb-home-score">0</div>
                <div class="sb-timeout-tag" id="sb-home-timeout-tag">TIMEOUT</div>
                <div class="sb-bonus-text" id="sb-home-bonus-text">BONUS</div>
            </div>
            <div class="sb-period-cell">
                <div class="sb-period" id="sb-period">1st</div>
                <div class="sb-period-sub" id="sb-period-sub">BREAK</div>
            </div>
            <div class="sb-score-col">
                <div class="sb-score" id="sb-away-score">0</div>
                <div class="sb-timeout-tag" id="sb-away-timeout-tag">TIMEOUT</div>
                <div class="sb-bonus-text" id="sb-away-bonus-text">BONUS</div>
            </div>

            <aside class="sb-rail sb-rail-away">
                <div class="sb-fouls-block">
                    <div class="sb-stat-label">FOULS</div>
                    <div class="sb-stat-num" id="sb-away-fouls">0</div>
                </div>
                <div class="sb-timeouts-block">
                    <div class="sb-stat-label">TIMEOUTS</div>
                    <div class="sb-to-grid">
                        <div class="sb-to-sub">FULL</div>
                        <div class="sb-to-sub">SHORT</div>
                        <div class="sb-stat-num" id="sb-away-to-full">0</div>
                        <div class="sb-stat-num" id="sb-away-to-short">0</div>
                    </div>
                </div>
            </aside>
        </div>

        <div class="sb-conn-wrap"><span id="sb-conn" class="sb-conn">Connecting&hellip;</span></div>
    </section>

    <script src="app.js"></script>
</body>
</html>
