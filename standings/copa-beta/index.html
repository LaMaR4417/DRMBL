<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Standings - Copa Beta</title>
    <link rel="icon" href="/assets/favicon.ico">
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
    <link rel="stylesheet" href="/css/skeleton.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/standings.css">
    <script src="/js/skeleton.js"></script>
</head>
<body>

    <section class="standings-hero">
        <div class="league-switcher" id="league-switcher">
            <a href="/standings/drmbl" class="league-btn" data-league="drmbl">
                <img src="/PSDs/DRMBL-Logo.png" alt="DRMBL" class="league-logo-img">
            </a>
            <a href="/standings/copa-beta" class="league-btn" data-league="copa-beta">
                <img src="/PSDs/Beta-Logo.png" alt="Copa Beta" class="league-logo-img">
            </a>
            <a href="/standings/lomba" class="league-btn" data-league="lomba">
                <img src="/PSDs/LOMBA-Logo.png" alt="LOMBA" class="league-logo-img">
            </a>
        </div>
    </section>

    <nav class="standings-filter-nav" id="standings-filters">
        <!-- Populated by JS -->
    </nav>

    <section class="standings-section">
        <div id="standings-content">
            <!-- Populated by JS -->
        </div>
    </section>

    <footer>
        &copy; 2026 Del Rio Men's Basketball League
    </footer>

    <script src="/js/standings.js"></script>
</body>
</html>
