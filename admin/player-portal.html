<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Portal — Admin</title>
    <link rel="stylesheet" href="/css/admin-portal.css">
</head>
<body>
    <header class="admin-header">
        <h1>Player Portal</h1>
    </header>

    <div class="admin-tabs">
        <button type="button" class="admin-tab active" data-tab="add">Add Player</button>
        <button type="button" class="admin-tab" data-tab="edit">Edit Players</button>
    </div>

    <main class="admin-main">
        <!-- ADD TAB -->
        <section class="admin-panel active" id="panel-add">
            <div class="admin-form-group">
                <label for="add-league">League</label>
                <select id="add-league">
                    <option value="">Select a league...</option>
                </select>
            </div>
            <div class="admin-form-group">
                <label for="add-team">Team</label>
                <select id="add-team" disabled>
                    <option value="">Select a team...</option>
                </select>
            </div>
            <div class="admin-form-group">
                <label for="add-name">Player Name</label>
                <input type="text" id="add-name" placeholder="e.g. Luis Mario Reyes" autocomplete="off" />
            </div>
            <div class="admin-actions">
                <button type="button" class="admin-btn admin-btn-primary" id="add-submit" disabled>Add Player</button>
            </div>
            <div class="admin-status" id="add-status"></div>
        </section>

        <!-- EDIT TAB -->
        <section class="admin-panel" id="panel-edit">
            <div class="admin-form-group">
                <label for="edit-league">League</label>
                <select id="edit-league">
                    <option value="">Select a league...</option>
                </select>
            </div>
            <div class="admin-form-group">
                <label for="edit-team">Team</label>
                <select id="edit-team" disabled>
                    <option value="">Select a team...</option>
                </select>
            </div>
            <div id="roster-list" class="roster-list"></div>

            <div id="edit-form" class="edit-form">
                <h3>Edit Player</h3>
                <input type="hidden" id="edit-player-id" />

                <div class="admin-form-group">
                    <label for="edit-name">Name</label>
                    <input type="text" id="edit-name" placeholder="Player name" />
                </div>
                <div class="admin-form-group">
                    <label for="edit-unique-number">Unique Number <span class="hint">(global player identifier)</span></label>
                    <input type="number" id="edit-unique-number" min="0" placeholder="Optional" />
                </div>
                <div class="admin-form-group">
                    <label for="edit-number">Jersey Numbers <span class="hint">(comma-separated, for this team)</span></label>
                    <input type="text" id="edit-number" placeholder="e.g. 5, 23" />
                </div>

                <fieldset class="admin-fieldset">
                    <legend>Bio</legend>

                    <div class="admin-form-group">
                        <label for="edit-position">Primary Position</label>
                        <select id="edit-position">
                            <option value="">—</option>
                            <option value="PG">PG (Point Guard)</option>
                            <option value="SG">SG (Shooting Guard)</option>
                            <option value="SF">SF (Small Forward)</option>
                            <option value="PF">PF (Power Forward)</option>
                            <option value="C">C (Center)</option>
                        </select>
                    </div>

                    <div class="admin-form-group">
                        <label>Secondary Positions</label>
                        <div class="position-checkboxes" id="edit-position-secondary">
                            <label class="position-chk"><input type="checkbox" value="PG"> PG</label>
                            <label class="position-chk"><input type="checkbox" value="SG"> SG</label>
                            <label class="position-chk"><input type="checkbox" value="SF"> SF</label>
                            <label class="position-chk"><input type="checkbox" value="PF"> PF</label>
                            <label class="position-chk"><input type="checkbox" value="C"> C</label>
                        </div>
                    </div>

                    <div class="admin-row">
                        <div class="admin-form-group">
                            <label for="edit-height-ft">Height (ft)</label>
                            <input type="number" id="edit-height-ft" min="0" max="8" placeholder="0" />
                        </div>
                        <div class="admin-form-group">
                            <label for="edit-height-in">Height (in)</label>
                            <input type="number" id="edit-height-in" min="0" max="11" placeholder="0" />
                        </div>
                        <div class="admin-form-group">
                            <label for="edit-weight">Weight (lbs)</label>
                            <input type="number" id="edit-weight" min="0" placeholder="0" />
                        </div>
                    </div>

                    <div class="admin-form-group">
                        <label for="edit-dob">Date of Birth</label>
                        <input type="date" id="edit-dob" />
                    </div>
                </fieldset>

                <div class="admin-actions">
                    <button type="button" class="admin-btn admin-btn-primary" id="edit-save">Save Changes</button>
                    <button type="button" class="admin-btn admin-btn-danger" id="edit-delete">Delete Player</button>
                    <button type="button" class="admin-btn" id="edit-cancel">Cancel</button>
                </div>
                <div class="admin-status" id="edit-status"></div>
            </div>
        </section>
    </main>

    <script src="/js/admin-player-portal.js"></script>
</body>
</html>
