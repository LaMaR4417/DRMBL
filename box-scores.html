<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Scores - DRMBL</title>
    <link rel="icon" href="assets/favicon.ico">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <link rel="stylesheet" href="css/skeleton.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/live-game.css">
    <link rel="stylesheet" href="css/box-scores.css">
    <script src="js/skeleton.js"></script>
</head>
<body>

    <!-- Live games / loading / empty state -->
    <section id="bs-spotlight" class="bs-spotlight">
        <p id="bs-spotlight-msg" class="hidden">Loading all games...</p>
        <div id="bs-live-games" class="game-selector hidden"></div>
    </section>

    <!-- Game cards list (filter bar inside, constrained to max-width) -->
    <section id="bs-game-list" class="bs-game-list">
        <nav class="bs-filter-bar" id="bs-filter-bar">
            <div class="bs-filter-row">
                <!-- DRMBL-only site: league is locked to DRMBL, dropdown hidden. -->
                <select id="bs-league-select" class="bs-filter-select bs-filter-primary-select hidden" title="Select league">
                    <option value="">All Leagues</option>
                </select>
                <!-- Division stays in DOM but auto-hides when ≤1 division exists (DRMBL has only "Open"). -->
                <div class="bs-filter-group bs-filter-division-group" id="bs-division-group">
                    <select id="bs-division-select" class="bs-filter-select bs-filter-subtle-select" title="Select division">
                        <option value="">All Divisions</option>
                    </select>
                </div>
                <!-- Season hidden for now (single active season). Un-hide when a new season is added. -->
                <select id="bs-season-select" class="bs-filter-select bs-filter-primary-select hidden" title="Select season">
                    <option value="">All Seasons</option>
                </select>
                <select id="bs-team-select" class="bs-filter-select bs-filter-secondary-select" title="Select team">
                    <option value="">All Teams</option>
                </select>
                <select id="bs-date-select" class="bs-filter-select bs-filter-secondary-select" title="Select date">
                    <option value="">All Dates</option>
                </select>
                <button type="button" class="bs-filter-clear-all hidden" id="bs-clear-all">Clear All</button>
            </div>
            <div class="bs-week-tabs" id="bs-week-tabs"></div>
        </nav>
        <div id="bs-game-cards"></div>
    </section>

    <!-- Full box score display (hidden until a game is clicked) -->
    <section id="bs-detail" class="live-game-section hidden">

        <!-- Scoreboard (reuses live-game classes, no status header) -->
        <div class="live-scoreboard">
            <div class="live-score-row">
                <div class="live-team-side home">
                    <span class="live-team-name" id="bs-home-name">HOME</span>
                    <span class="live-team-score" id="bs-home-score">0</span>
                </div>
                <div class="live-clock-inline">
                    <span class="live-league-badge" id="bs-league-badge"></span>
                    <span class="live-quarter" id="bs-quarter">FINAL</span>
                </div>
                <div class="live-team-side away">
                    <span class="live-team-score" id="bs-away-score">0</span>
                    <span class="live-team-name" id="bs-away-name">AWAY</span>
                </div>
            </div>
        </div>

        <!-- Body: two columns (same as live-game) -->
        <div class="live-body">
            <div class="live-col live-col-left">
                <div class="live-section">
                    <div class="live-section-title">SCORING BY PERIOD</div>
                    <div id="bs-quarter-scores"></div>
                </div>
                <div class="live-section">
                    <div class="live-section-title">TEAM STATS</div>
                    <div id="bs-team-stats"></div>
                </div>
            </div>
            <div class="live-col live-col-right">
                <div class="live-section" id="bs-away-player-stats"></div>
                <div class="live-section" id="bs-home-player-stats"></div>
            </div>
        </div>
    </section>

    <footer>
        &copy; 2026 Del Rio Men's Basketball League
    </footer>

    <script src="js/box-scores.js"></script>
</body>
</html>
