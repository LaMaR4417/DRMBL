<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3-Point Contest — Crowd Screen</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="assets/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #c8a45c; --red: #c9302c; --white: #fff; --bg: #0a0a0a;
            --dim: rgba(255,255,255,.4); --line: rgba(255,255,255,.10);
        }
        * { box-sizing: border-box; -webkit-user-select: none; user-select: none; }
        html, body { margin: 0; height: 100%; }
        body {
            background: radial-gradient(circle at 50% -10%, #1a1a1a, var(--bg) 65%);
            color: var(--white); font-family: 'Inter', system-ui, sans-serif;
            height: 100vh; overflow: hidden; cursor: pointer;
        }
        .bebas { font-family: 'Bebas Neue', sans-serif; }

        /* Idle */
        #idle { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
        #idle .logo { font-family: 'Bebas Neue', sans-serif; letter-spacing: 6px; font-size: clamp(30px, 6vw, 70px); color: var(--gold); text-transform: uppercase; text-align: center; }
        #idle .msg { color: var(--dim); letter-spacing: 3px; text-transform: uppercase; font-size: clamp(13px, 2vw, 20px); }
        .pulse { animation: pulse 1.6s ease-in-out infinite; }
        @keyframes pulse { 0%,100% { opacity: .4; } 50% { opacity: 1; } }

        /* Board */
        #board { height: 100vh; display: none; flex-direction: column; }
        #board.show { display: flex; }
        .bhead { text-align: center; padding: 2.5vh 10px 0; }
        .bhead .event { font-family: 'Bebas Neue', sans-serif; letter-spacing: 6px; font-size: clamp(18px, 3.5vw, 40px); color: var(--gold); text-transform: uppercase; }
        .bhead .round { letter-spacing: 4px; text-transform: uppercase; color: var(--dim); font-size: clamp(11px, 1.7vw, 18px); }

        .matchup { flex: 1; display: flex; align-items: stretch; min-height: 0; }
        .side { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1vh 1vw; transition: opacity .25s; }
        .side .nm { font-family: 'Bebas Neue', sans-serif; letter-spacing: 2px; text-transform: uppercase; text-align: center; line-height: .95; font-size: clamp(30px, 5.5vw, 84px); }
        .side .tm { color: var(--dim); text-transform: uppercase; letter-spacing: 3px; margin-top: 1vh; font-size: clamp(12px, 1.8vw, 24px); }
        .side .sc { font-family: 'Bebas Neue', sans-serif; line-height: .85; font-size: clamp(140px, 30vh, 460px); }
        .side.win { background: linear-gradient(180deg, rgba(200,164,92,.22), rgba(200,164,92,.04) 62%, transparent 88%); }
        .side.win .nm, .side.win .sc { color: var(--gold); }
        .side.lose { opacity: .35; }
        .side .tag { margin-top: 1vh; font-family: 'Bebas Neue', sans-serif; letter-spacing: 4px; color: var(--gold); font-size: clamp(16px, 2.4vw, 32px); opacity: 0; }
        .side.win .tag { opacity: 1; }

        .center { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 1vw; flex-shrink: 0; }
        .center .vs { font-family: 'Bebas Neue', sans-serif; color: var(--dim); font-size: clamp(24px, 3.5vw, 52px); letter-spacing: 2px; }
        .divline { width: 2px; background: var(--line); flex: 1; align-self: center; min-height: 8vh; }

        .timerwrap { text-align: center; padding: 1vh 10px 3.5vh; }
        .timer { font-family: 'Bebas Neue', sans-serif; font-size: clamp(90px, 20vh, 260px); line-height: .9; letter-spacing: 6px; font-variant-numeric: tabular-nums; }
        .timer.low { color: var(--gold); }
        .timer.done { color: var(--red); animation: flash .55s steps(1) infinite; }
        .timer.paused { color: var(--dim); }
        @keyframes flash { 50% { opacity: .2; } }
        .finalbar { font-family: 'Bebas Neue', sans-serif; letter-spacing: 6px; color: var(--gold); text-transform: uppercase; font-size: clamp(20px, 3vw, 40px); }
    </style>
</head>
<body>
    <div id="idle">
        <div class="logo">3-Point Contest</div>
        <div class="msg pulse" id="idle-msg">Waiting for the recorder&hellip;</div>
    </div>

    <div id="board">
        <div class="bhead">
            <div class="event">3-Point Contest</div>
            <div class="round" id="round"></div>
        </div>
        <div class="matchup">
            <div class="side" id="side-a">
                <div class="nm" id="a-name"></div>
                <div class="tm" id="a-team"></div>
                <div class="sc" id="a-score">0</div>
                <div class="tag">Winner</div>
            </div>
            <div class="center"><div class="divline"></div><div class="vs">VS</div><div class="divline"></div></div>
            <div class="side" id="side-b">
                <div class="nm" id="b-name"></div>
                <div class="tm" id="b-team"></div>
                <div class="sc" id="b-score">0</div>
                <div class="tag">Winner</div>
            </div>
        </div>
        <div class="timerwrap">
            <div class="timer" id="timer">2:00</div>
            <div class="finalbar" id="finalbar"></div>
        </div>
    </div>

    <script>
    (function () {
        var $ = function (id) { return document.getElementById(id); };

        function fmt(t) {
            t = Math.max(0, t == null ? 0 : t);
            if (t >= 60) { var m = Math.floor(t / 60), s = Math.floor(t % 60); return m + ':' + (s < 10 ? '0' : '') + s; }
            return t.toFixed(1);
        }

        function showIdle(msg) {
            $('board').classList.remove('show');
            $('idle').style.display = 'flex';
            if (msg) $('idle-msg').textContent = msg;
        }

        function render(p) {
            if (!p) return;
            $('idle').style.display = 'none';
            $('board').classList.add('show');
            $('round').textContent = p.rl || '';
            $('a-name').textContent = (p.a && p.a.name) || '';
            $('a-team').textContent = (p.a && p.a.team) || '';
            $('b-name').textContent = (p.b && p.b.name) || '';
            $('b-team').textContent = (p.b && p.b.team) || '';
            $('a-score').textContent = p.scoreA != null ? p.scoreA : 0;
            $('b-score').textContent = p.scoreB != null ? p.scoreB : 0;

            var a = $('side-a'), b = $('side-b');
            a.classList.remove('win', 'lose'); b.classList.remove('win', 'lose');
            if (p.finished && p.winner) {
                a.classList.add(p.winner === 'a' ? 'win' : 'lose');
                b.classList.add(p.winner === 'b' ? 'win' : 'lose');
            }

            var timer = $('timer');
            timer.textContent = fmt(p.remaining);
            var done = (p.remaining != null && p.remaining <= 0);
            var low = (!done && p.remaining != null && p.remaining <= 10);
            timer.className = 'timer' + (done ? ' done' : (low ? ' low' : (p.running ? '' : ' paused')));

            $('finalbar').textContent = p.finished
                ? ((p.winner === 'a' ? (p.a && p.a.name) : (p.b && p.b.name)) || '') + ' wins'
                : '';
        }

        if (typeof BroadcastChannel === 'undefined') {
            showIdle('This browser does not support live sync.');
            return;
        }
        var bc = new BroadcastChannel('drmbl-3pt');
        bc.onmessage = function (ev) {
            var msg = ev && ev.data;
            if (!msg) return;
            if (msg.type === 'state' && msg.payload) render(msg.payload);
            else if (msg.type === 'clear') showIdle('Waiting for the next matchup…');
        };
        // Ask the recorder for the current match so we render immediately on open.
        try { bc.postMessage({ type: 'request-state' }); } catch (e) {}

        // Click anywhere to toggle fullscreen (handy on the second screen).
        document.body.addEventListener('click', function () {
            if (!document.fullscreenElement) { (document.documentElement.requestFullscreen || function () {}).call(document.documentElement); }
            else if (document.exitFullscreen) { document.exitFullscreen(); }
        });
    })();
    </script>
</body>
</html>
