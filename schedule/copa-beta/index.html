<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule - DRMBL</title>
    <link rel="icon" href="/assets/favicon.ico">
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
    <link rel="stylesheet" href="/css/skeleton.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/schedule.css">
    <script src="/js/skeleton.js"></script>
</head>
<body>

    <!-- SCHEDULE HERO -->
    <section class="schedule-hero">
        <div class="league-switcher" id="league-switcher">
            <a href="/schedule/drmbl" class="league-btn" data-league="drmbl">
                <img src="/PSDs/DRMBL-Logo.png" alt="DRMBL" class="league-logo-img">
            </a>
            <a href="/schedule/copa-beta" class="league-btn" data-league="copa-beta">
                <img src="/PSDs/Beta-Logo.png" alt="Copa Beta" class="league-logo-img">
            </a>
            <a href="/schedule/lomba" class="league-btn" data-league="lomba">
                <img src="/PSDs/LOMBA-Logo.png" alt="LOMBA" class="league-logo-img">
            </a>
        </div>
    </section>

    <!-- WEEK NAVIGATION -->
    <nav class="week-nav" id="week-nav">
        <div class="week-nav-inner" id="week-nav-inner">
            <!-- Populated by JS -->
        </div>
    </nav>

    <!-- SCHEDULE CONTENT -->
    <div id="schedule-content">
        <!-- Populated by JS -->
    </div>

    <!-- FOOTER -->
    <footer>
        &copy; 2026 Del Rio Men's Basketball League
    </footer>

    <script src="/js/schedule.js"></script>
</body>
</html>
